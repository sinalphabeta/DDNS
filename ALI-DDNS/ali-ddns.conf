# Aliyun AccessKey (建议使用仅有云解析权限的 RAM 子账号)
ALI_ACCESS_KEY_ID="Your AccessKey ID"
ALI_ACCESS_KEY_SECRET="Your AccessKey Secret"

# Domain Configuration
# SUBDOMAIN 为主机记录。根域名填 @
DOMAIN="example.com"
SUBDOMAIN="home"

# Record Type: A or AAAA
RECORD_TYPE="A"

# 免费版云解析 TTL 最小 600 秒，付费版可以更小
TTL="600"

# 解析线路，默认 default。电信/联通等线路见阿里云解析线路枚举
LINE="default"

# API 接入点，一般不用改。国际站若不通可改为对应地域域名
# ALI_ENDPOINT="alidns.aliyuncs.com"

# Telegram Notification (Optional)
# Leave empty to disable. Chat ID can be a personal user ID or a group ID.
TG_BOT_TOKEN=""
TG_CHAT_ID=""
